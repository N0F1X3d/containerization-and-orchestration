apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
  labels:
    app.kubernetes.io/name: shop-api
    {{- include "shop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: shop-api}
  # Rolling update: сначала поднять новый под (maxSurge 1), старый гасить, только когда новый Ready
  # (maxUnavailable 0) — так рабочих подов никогда не становится меньше нужного.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shop-api
        {{- include "shop.labels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          env:
            {{- include "shop.dbEnv" . | nindent 12 }}
            - {name: HEALTH_FAIL, value: {{ .Values.api.healthFail | quote }}}
          # readiness: можно ли слать трафик; liveness: не завис ли процесс (иначе перезапуск).
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          # Под получил команду на удаление — но kube-proxy ещё пару секунд шлёт на него трафик,
          # пока не узнает, что под убран из Endpoints. 5 секунд «дожить» до SIGTERM — и ни один запрос не теряется.
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          {{- include "shop.containerSecurity" . | nindent 10 }}
          {{- include "shop.dbMount" . | nindent 10 }}
      {{- include "shop.dbVolume" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: shop-api
  labels:
    app.kubernetes.io/name: shop-api
    {{- include "shop.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: shop-api}
  ports:
    - {name: http, port: 8080, targetPort: http}

score: 30
resources:
- cpu
- memory
description: '[b]Simple Strategy[/b]


  CPU request: 95.0% percentile, limit: unset

  Memory request: max + 15.0%, limit: max + 15.0%

  History: 1.0 hours

  Step: 1.25 minutes


  All parameters can be customized. For example: `krr simple --cpu_percentile=90 --memory_buffer_percentage=15
  --history_duration=24 --timeframe_duration=0.5`


  This strategy does not work with objects with HPA defined (Horizontal Pod Autoscaler).

  If HPA is defined for CPU or Memory, the strategy will return "?" for that resource.

  You can override this behaviour by passing the --allow-hpa flag


  Learn more: [underline]https://github.com/robusta-dev/krr#algorithm[/underline]'
strategy:
  name: simple
  settings:
    history_duration: 1.0
    timeframe_duration: 1.25
    cpu_percentile: 95.0
    memory_buffer_percentage: 15.0
    points_required: 10
    allow_hpa: false
    use_oomkill_data: false
    oom_memory_buffer_percentage: 25.0

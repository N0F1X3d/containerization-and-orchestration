# Часть 7: давление по памяти на lab-worker. api возвращаем к 3 репликам (part6-* в этой команде не участвуют).
# batch прибиваем к lab-worker, чтобы давление было именно там (там же задан порог eviction kubelet),
# и поднимаем его потребление: 4 пода × 500 МБ — выше их requests (128Mi), но ниже лимита (512Mi),
# то есть по собственному лимиту их не убьёт — убьёт kubelet за давление на ноду.
batch:
  replicas: 4
  node: lab-worker
  memoryMB: 500

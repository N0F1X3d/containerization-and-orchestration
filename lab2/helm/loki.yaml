# Loki одним процессом (SingleBinary) с хранением на диске пода — для лабы больше не нужно.
deploymentMode: SingleBinary
loki:
  auth_enabled: false                 # без мультитенантности
  commonConfig: {replication_factor: 1}
  storage: {type: filesystem}
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: index_, period: 24h}
singleBinary: {replicas: 1}
# Компоненты распределённого режима и кэши не нужны.
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
gateway: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
minio: {enabled: false}

# Echo-сервер: печатает в stdout каждый пришедший запрос вместе с телом (JSON от Alertmanager).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  labels: {app.kubernetes.io/name: alert-receiver}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: alert-receiver}
  template:
    metadata:
      labels: {app.kubernetes.io/name: alert-receiver}
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:39
          env:
            - {name: HTTP_PORT, value: "8080"}
            - {name: LOG_IGNORE_PATH, value: "/healthz"}
          ports:
            - {name: http, containerPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
spec:
  selector: {app.kubernetes.io/name: alert-receiver}
  ports:
    - {name: http, port: 8080, targetPort: http}
